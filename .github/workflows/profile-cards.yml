name: coderprint

# Redraws the profile panel every day from every repository the account owns, private ones included,
# with the coderprint Action. Reading goes through the account's own GitHub App (read-only Contents and
# Metadata), which mints a token that expires within the hour; until the App is set up, the run skips.

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Overwrite the panel even if fewer repositories are visible than last time"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: coderprint
  cancel-in-progress: false

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mint a read-only token from the coderprint App
        id: app
        if: ${{ vars.CODERPRINT_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CODERPRINT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODERPRINT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          permission-metadata: read

      - name: Skip until the App is set up
        if: ${{ steps.app.outputs.token == '' }}
        run: echo "::notice::The coderprint App is not set up yet, so the committed panel stays as it is."

      - uses: WikdSolvemProbler/coderprint@v1
        if: ${{ steps.app.outputs.token != '' }}
        with:
          token: ${{ steps.app.outputs.token }}
          window: all
          spotify-uid: 1joahg6umn39flaqsl1c3j9n3
          mark: ${{ secrets.CODERPRINT_MARK }}
          mark-turn: "10"
          force: ${{ inputs.force && 'true' || 'false' }}
