name: coderprint

# Redraws the profile panel every day from every repository the account owns, private ones included,
# with the coderprint Action. Reading goes through the account's own GitHub App (read-only Contents and
# Metadata), which mints a token that expires within the hour. The whole job is skipped until the App
# is set up, so no action is fetched before then.

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Redraw even if fewer repositories are visible than last time"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: coderprint
  cancel-in-progress: false

jobs:
  panel:
    if: ${{ vars.CODERPRINT_APP_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mint a read-only token from the coderprint App
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CODERPRINT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODERPRINT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          permission-metadata: read

      - uses: WikdSolvemProbler/coderprint@66ba952fa9c95267f3e48262e31538000e365c56 # main at 66ba952, lines of code
        with:
          token: ${{ steps.app.outputs.token }}
          window: all
          spotify-uid: 1joahg6umn39flaqsl1c3j9n3
          relay: https://coderprint-relay.vercel.app/api/card
          mark: ${{ secrets.CODERPRINT_MARK }}
          force: ${{ inputs.force && 'true' || 'false' }}
