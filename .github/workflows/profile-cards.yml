name: coderprint

# Redraws the personal panel every day from personally owned repositories, private ones included.
# Organization contributions are refreshed locally into assets/organizations/ and their own README
# block. This job needs no organization access and preserves those manual outputs.
# Reading goes through the account's existing GitHub App (read-only Contents and
# Metadata), which mints a token that expires within the hour. The whole job is skipped until the App
# is set up, so no action is fetched before then.

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Redraw even if fewer repositories are visible than last time"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: coderprint
  cancel-in-progress: false

jobs:
  panel:
    if: ${{ vars.CODERPRINT_APP_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked] -- v7.0.1; pushes generated assets with checkout credentials; no checkout artifacts are uploaded.

      - name: Mint a read-only token from the coderprint App
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CODERPRINT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODERPRINT_APP_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app] -- Explicit read-only scan of all personally owned repositories.
          permission-contents: read
          permission-metadata: read

      - uses: WikdSolvemProbler/coderprint@dba9e3b29e2edd6972b590ded61fe8412c65d443 # reviewed generator, merged PR #5
        with:
          token: ${{ steps.app.outputs.token }}
          window: all
          spotify-uid: 1joahg6umn39flaqsl1c3j9n3
          relay: https://coderprint-relay.vercel.app/api/card
          mark: ${{ secrets.CODERPRINT_MARK }}
          force: ${{ inputs.force && 'true' || 'false' }}
