name: coderprint

# Redraws the profile panel every day from personally owned repositories and the owner's work in
# the explicitly configured organization installation, private ones included,
# with the coderprint Action. Reading goes through the account's own GitHub App (read-only Contents and
# Metadata), which mints a token that expires within the hour. The whole job is skipped until the App
# is set up, so no action is fetched before then.

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Redraw even if fewer repositories are visible than last time"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: coderprint
  cancel-in-progress: false

jobs:
  panel:
    if: ${{ vars.CODERPRINT_APP_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked] -- v7.0.1; pushes generated assets with checkout credentials; no checkout artifacts are uploaded.

      - name: Mint a read-only token from the coderprint App
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CODERPRINT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODERPRINT_APP_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app] -- Explicit read-only scan of all personally owned repositories.
          permission-contents: read
          permission-metadata: read

      - name: Require an explicit organization repository selector
        shell: bash
        env:
          ORGANIZATION_REPOSITORIES: ${{ secrets.CODERPRINT_ORGANIZATION_REPOSITORIES }}
        run: |
          timeout 10 python3 - <<'PY'
          import os, re
          selected = os.environ.get("ORGANIZATION_REPOSITORIES", "").strip()
          if not re.fullmatch(r"[A-Za-z0-9._-]{1,100}", selected) or selected in (".", ".."):
              print("::error::Configure one organization repository in its selector secret.")
              raise SystemExit(1)
          PY

      - name: Mint a separate read-only organization installation token
        id: organization
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CODERPRINT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODERPRINT_APP_KEY }}
          owner: HeresyWorks
          repositories: ${{ secrets.CODERPRINT_ORGANIZATION_REPOSITORIES }}
          permission-contents: read
          permission-metadata: read

      - uses: WikdSolvemProbler/coderprint@dba9e3b29e2edd6972b590ded61fe8412c65d443 # organization contributions, merged PR #5
        with:
          token: ${{ steps.app.outputs.token }}
          organizations: HeresyWorks
          organization-tokens: ${{ format('{{"HeresyWorks":"{0}"}}', steps.organization.outputs.token) }}
          authored-imports: ${{ secrets.CODERPRINT_AUTHORED_IMPORTS }}
          window: all
          spotify-uid: 1joahg6umn39flaqsl1c3j9n3
          relay: https://coderprint-relay.vercel.app/api/card
          mark: ${{ secrets.CODERPRINT_MARK }}
          force: ${{ inputs.force && 'true' || 'false' }}
